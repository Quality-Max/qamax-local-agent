name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build all targets
        run: |
          mkdir -p build
          # Stamp the source SHA into the receipt (agent_build_sha), matching the Makefile.
          SHA="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X github.com/Quality-Max/qmax-receipt.BuildSHA=$SHA"
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/qmax-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/qmax-darwin-arm64 .
          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/qmax-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/qmax-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/qmax-darwin-amd64
            build/qmax-darwin-arm64
            build/qmax-linux-amd64
            build/qmax-windows-amd64.exe
